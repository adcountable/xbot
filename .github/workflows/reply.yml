name: xbot-reply

on:
  schedule:
    # Replies — 30x/day (every 48 minutes)
    - cron: '0 0 * * *'
    - cron: '48 0 * * *'
    - cron: '36 1 * * *'
    - cron: '24 2 * * *'
    - cron: '12 3 * * *'
    - cron: '0 4 * * *'
    - cron: '48 4 * * *'
    - cron: '36 5 * * *'
    - cron: '24 6 * * *'
    - cron: '12 7 * * *'
    - cron: '0 8 * * *'
    - cron: '48 8 * * *'
    - cron: '36 9 * * *'
    - cron: '24 10 * * *'
    - cron: '12 11 * * *'
    - cron: '0 12 * * *'
    - cron: '48 12 * * *'
    - cron: '36 13 * * *'
    - cron: '24 14 * * *'
    - cron: '12 15 * * *'
    - cron: '0 16 * * *'
    - cron: '48 16 * * *'
    - cron: '36 17 * * *'
    - cron: '24 18 * * *'
    - cron: '12 19 * * *'
    - cron: '0 20 * * *'
    - cron: '48 20 * * *'
    - cron: '36 21 * * *'
    - cron: '24 22 * * *'
    - cron: '12 23 * * *'

  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python reply_bot.py
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY:              ${{ secrets.X_API_KEY }}
          X_API_SECRET:           ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:  ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN:         ${{ secrets.X_BEARER_TOKEN }}
